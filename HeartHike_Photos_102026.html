<style>
:root{--navy:#1A1A2E;--red:#B52A2A;--bone:#FBFAF8;--pink:#E8B4B8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#26264a 0%,var(--navy) 60%);background-color:var(--navy);color:var(--bone);font-family:'Source Sans 3',system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:56px 20px 28px}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(2rem,6vw,3.4rem);margin:0 0 10px;letter-spacing:.01em}
.sub{color:var(--pink);font-size:1.05rem;margin:0}
.rule{width:64px;height:3px;background:var(--red);margin:22px auto 0;border-radius:2px}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.wide{margin-bottom:14px}
.grid{columns:3 280px;column-gap:14px}
.ph{display:block;margin:0 0 14px;break-inside:avoid;border-radius:6px;overflow:hidden;background:#111;line-height:0}
.ph img{width:100%;height:auto;display:block;transition:transform .35s ease,opacity .2s}
.ph:hover img{transform:scale(1.03)}
.cta{text-align:center;padding:20px 16px 64px}
.btn{display:inline-block;background:var(--red);color:var(--bone);text-decoration:none;font-weight:600;font-size:1.05rem;padding:14px 34px;border-radius:999px;transition:background .2s}
.btn:hover{background:#cf3434}
.home{display:block;margin-top:18px;color:var(--pink);font-size:.95rem}
footer{text-align:center;font-size:.85rem;color:#9a9ab0;padding:0 16px 36px}
#lb{position:fixed;inset:0;background:rgba(10,10,20,.95);display:none;align-items:center;justify-content:center;z-index:10}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:90vh;border-radius:4px}
#lb button{position:absolute;background:none;border:0;color:var(--bone);font-size:2.4rem;cursor:pointer;padding:14px;line-height:1}
#x{top:8px;right:12px}#pv{left:6px;top:50%}#nx{right:6px;top:50%}

<div id="lb" aria-hidden="true"><button id="x" aria-label="Close">&times;</button><button id="pv" aria-label="Previous">&#8249;</button><img alt=""><button id="nx" aria-label="Next">&#8250;</button></div>
<script>
(function(){
  var links=[].slice.call(document.querySelectorAll('a.ph')),lb=document.getElementById('lb'),im=lb.querySelector('img'),cur=0;
  function show(i){cur=(i+links.length)%links.length;im.src=links[cur].href;lb.classList.add('on')}
  links.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();show(i)})});
  document.getElementById('x').onclick=function(){lb.classList.remove('on')};
  document.getElementById('pv').onclick=function(){show(cur-1)};
  document.getElementById('nx').onclick=function(){show(cur+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('on')});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
})();
</script>
