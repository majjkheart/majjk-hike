<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJJK Heart Family Foundation | Links</title>
<meta name="description" content="Donate, see Heart Hike photos, visit our site, and find us on social, all in one place.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1A1A2E;
    --red: #B52A2A;
    --red-light: #d43232;
    --cream: #FAF8F4;
    --warm-gray: #F0EDE8;
    --mid-gray: #8A8480;
    --dark: #111118;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--navy);
    font-family: 'Source Sans 3', sans-serif;
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 55% at 50% 100%, rgba(181,42,42,0.16) 0%, transparent 70%);
    pointer-events: none;
  }

  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 28px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .logo {
    width: 108px;
    height: auto;
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 0.7s 0.1s ease forwards;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.7s 0.2s ease forwards;
  }
  .brand span { color: var(--red); }

  .tagline {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(250,248,244,0.55);
    text-align: center;
    margin-top: 10px;
    line-height: 1.7;
    max-width: 30ch;
    opacity: 0;
    animation: fadeUp 0.7s 0.3s ease forwards;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 40px;
    opacity: 0;
    animation: fadeUp 0.7s 0.4s ease forwards;
  }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 18px 20px;
    text-decoration: none;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    border-radius: 2px;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .link-btn:active { transform: scale(0.98); }

  .link-btn.primary {
    background: var(--red);
    color: #fff;
    border: 1.5px solid var(--red);
  }
  .link-btn.primary:hover { background: var(--red-light); border-color: var(--red-light); }

  .link-btn.outline {
    background: transparent;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.3);
  }
  .link-btn.outline:hover { border-color: #fff; background: rgba(255,255,255,0.06); }

  .link-sub {
    display: block;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: none;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
  }

  .divider-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin-top: 44px;
    opacity: 0;
    animation: fadeUp 0.7s 0.5s ease forwards;
  }
  .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.14); }
  .divider-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
  }

  .socials {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
    opacity: 0;
    animation: fadeUp 0.7s 0.6s ease forwards;
  }

  .social-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #fff;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .social-btn:hover { background: var(--red); border-color: var(--red); }

  .footer {
    margin-top: 48px;
    text-align: center;
    font-size: 10.5px;
    line-height: 1.8;
    color: rgba(255,255,255,0.38);
    opacity: 0;
    animation: fadeUp 0.7s 0.7s ease forwards;
  }
  .footer a { color: rgba(255,255,255,0.5); text-decoration: underline; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .brand, .tagline, .links, .divider-row, .socials, .footer {
      animation: none !important;
      opacity: 1 !important;
    }
  }

  a:focus-visible, .link-btn:focus-visible, .social-btn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }
</style>
</head>
